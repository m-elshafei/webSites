[global]
error_log = /proc/self/fd/2
daemonize = no
log_limit = 8192

[www]
user = app
group = app
listen = 0.0.0.0:9000

; access + slow logs land on the container's stdout/stderr
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

ping.path = /ping
pm.status_path = /status

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
